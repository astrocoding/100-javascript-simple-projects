<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>012 - Text to Speech Playground</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <main class="container">
    <h1>Text to Speech Playground</h1>
    <textarea id="textInput" rows="4" placeholder="Ketik sesuatu..."></textarea>

    <label for="voiceSelect">Pilih suara:</label>
    <select id="voiceSelect"></select>

    <div class="actions">
      <button id="speakBtn">🔊 Bicara</button>
      <button id="stopBtn">⏹️ Stop</button>
    </div>
  </main>
  <script src="script.js" defer></script>
</body>
</html>
