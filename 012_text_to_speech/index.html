<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>012 - Text to Speech Playground</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
</head>
<body>
  <main class="container">
    <a href="../index.html" class="back-btn" aria-label="Kembali ke katalog proyek">
      <i class="fa-solid fa-arrow-left"></i>
      <span>Kembali</span>
    </a>

    <h1>Text to Speech Playground</h1>
    <textarea id="textInput" rows="4" placeholder="Ketik sesuatu..."></textarea>

    <label for="voiceSelect">Pilih suara:</label>
    <select id="voiceSelect"></select>

    <div class="actions">
      <button id="speakBtn"><i class="fa-solid fa-volume-high"></i> Bicara</button>
      <button id="stopBtn"><i class="fa-solid fa-stop"></i> Stop</button>
    </div>
  </main>
  <script src="script.js" defer></script>
</body>
</html>
