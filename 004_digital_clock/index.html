<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock | Zaenal Alfian</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a href="../index.html" class="back-btn" aria-label="Kembali ke katalog proyek">
    <i class="fa-solid fa-arrow-left"></i>
    <span>Kembali</span>
  </a>

  <div class="clock-container">
    <div class="brand">
      <span>Zaenal Alfian</span>
    </div>
    <div class="date-box">
      <div id="day-name" class="date-part"></div>
      <div id="date" class="date-part"></div>
      <div id="month" class="date-part"></div>
      <div id="year" class="date-part"></div>
    </div>
    <div id="time" class="time-box"></div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
