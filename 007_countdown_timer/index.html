<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown Timer | Zaenal Alfian</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="card-wrapper">
    <a href="../index.html" class="back-btn" aria-label="Kembali ke katalog proyek">
      <i class="fa-solid fa-arrow-left"></i>
      <span>Kembali</span>
    </a>

    <div class="container">
      <header>
        <h1>Countdown Timer</h1>
        <p>Made by Zaenal Alfian</p>
      </header>
      <div class="input-container">
        <input type="datetime-local" id="date-input">
        <button id="start-btn">Start</button>
      </div>

      <div class="countdown">
        <div class="time-box">
          <div class="label">Days</div>
          <div id="days" class="time">00</div>
        </div>
        <div class="time-box">
          <div class="label">Hours</div>
          <div id="hours" class="time">00</div>
        </div>
        <div class="time-box">
          <div class="label">Minutes</div>
          <div id="minutes" class="time">00</div>
        </div>
        <div class="time-box">
          <div class="label">Seconds</div>
          <div id="seconds" class="time">00</div>
        </div>
      </div>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
